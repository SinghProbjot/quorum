<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="freccia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .corsia { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .etichetta { font-size: 13px; font-weight: 600; fill: #64748b; letter-spacing: 0.5px; }
      .titolo { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .testo { font-size: 12px; fill: #334155; }
      .nota { font-size: 11px; fill: #64748b; font-style: italic; }
      .linea { fill: none; stroke: #475569; stroke-width: 1.6; marker-end: url(#freccia); }
      .acq { fill: #e2e8f0; stroke: #64748b; }
      .elab { fill: #dbeafe; stroke: #2563eb; }
      .voci { fill: #dcfce7; stroke: #16a34a; }
      .llm { fill: #fef3c7; stroke: #d97706; }
      .out { fill: #f1f5f9; stroke: #0f172a; }
    </style>
  </defs>

  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Quorum: architecture</text>
  <text x="500" y="52" text-anchor="middle" class="nota">Fully on-device processing: no data ever leaves the computer</text>

  <g transform="translate(0,60)">
    <!-- Lanes -->
    <rect class="corsia" x="20" y="10" width="960" height="150" rx="8"/>
    <text class="etichetta" x="36" y="32">1. CAPTURE (tkinter interface)</text>
    <rect class="corsia" x="20" y="180" width="960" height="220" rx="8"/>
    <text class="etichetta" x="36" y="202">2. PROCESSING (background worker, job queue)</text>
    <rect class="corsia" x="20" y="420" width="960" height="210" rx="8"/>
    <text class="etichetta" x="36" y="442">3. NAMES, PROFILES AND SUMMARY</text>

    <!-- Lane 1 -->
    <rect class="acq" x="60" y="60" width="180" height="70" rx="6"/>
    <text class="titolo" x="150" y="90" text-anchor="middle">Microphone</text>
    <text class="testo" x="150" y="110" text-anchor="middle">MME input device</text>

    <rect class="acq" x="310" y="60" width="230" height="70" rx="6"/>
    <text class="titolo" x="425" y="86" text-anchor="middle">Recorder</text>
    <text class="testo" x="425" y="104" text-anchor="middle">audio.wav, 16 bit PCM</text>
    <text class="testo" x="425" y="120" text-anchor="middle">continuous write, pause</text>

    <rect class="acq" x="610" y="60" width="210" height="70" rx="6"/>
    <text class="titolo" x="715" y="86" text-anchor="middle">Existing file</text>
    <text class="testo" x="715" y="104" text-anchor="middle">wav, mp3, m4a, mp4, mkv</text>
    <text class="testo" x="715" y="120" text-anchor="middle">"Trascrivi file..." button</text>

    <path class="linea" d="M240,95 H306"/>

    <!-- Lane 1 to lane 2 -->
    <path class="linea" d="M425,130 V222 H122 V246"/>
    <path class="linea" d="M715,130 V222 H425"/>

    <!-- Lane 2 -->
    <rect class="elab" x="40" y="250" width="165" height="100" rx="6"/>
    <text class="titolo" x="122" y="282" text-anchor="middle">Decoding</text>
    <text class="testo" x="122" y="302" text-anchor="middle">PyAV</text>
    <text class="testo" x="122" y="318" text-anchor="middle">16 kHz mono</text>

    <rect class="elab" x="235" y="250" width="165" height="100" rx="6"/>
    <text class="titolo" x="317" y="282" text-anchor="middle">Segmentation</text>
    <text class="testo" x="317" y="302" text-anchor="middle">pyannote 3.0 (ONNX)</text>
    <text class="testo" x="317" y="318" text-anchor="middle">10 s windows, 5 s hop</text>
    <text class="testo" x="317" y="334" text-anchor="middle">up to 3 local speakers</text>

    <rect class="elab" x="430" y="250" width="165" height="100" rx="6"/>
    <text class="titolo" x="512" y="282" text-anchor="middle">Speaker embeddings</text>
    <text class="testo" x="512" y="302" text-anchor="middle">ERes2NetV2</text>
    <text class="testo" x="512" y="318" text-anchor="middle">one per speaker</text>
    <text class="testo" x="512" y="334" text-anchor="middle">and per window</text>

    <rect class="elab" x="625" y="250" width="165" height="100" rx="6"/>
    <text class="titolo" x="707" y="282" text-anchor="middle">Clustering</text>
    <text class="testo" x="707" y="302" text-anchor="middle">per-session centering</text>
    <text class="testo" x="707" y="318" text-anchor="middle">cosine AHC, threshold 0.8</text>
    <text class="testo" x="707" y="334" text-anchor="middle">centroid refinement</text>

    <rect class="elab" x="820" y="250" width="150" height="100" rx="6"/>
    <text class="titolo" x="895" y="282" text-anchor="middle">Transcription</text>
    <text class="testo" x="895" y="302" text-anchor="middle">faster-whisper</text>
    <text class="testo" x="895" y="318" text-anchor="middle">large-v3-turbo</text>
    <text class="testo" x="895" y="334" text-anchor="middle">per turn, on GPU</text>

    <path class="linea" d="M205,300 H231"/>
    <path class="linea" d="M400,300 H426"/>
    <path class="linea" d="M595,300 H621"/>
    <path class="linea" d="M790,300 H816"/>

    <!-- Lane 2 to lane 3 -->
    <path class="linea" d="M895,350 V458 H400 V476"/>
    <text class="nota" x="650" y="452" text-anchor="middle">turns, per-speaker embeddings</text>

    <!-- Lane 3 -->
    <rect class="voci" x="40" y="480" width="200" height="90" rx="6"/>
    <text class="titolo" x="140" y="508" text-anchor="middle">Voice profiles</text>
    <text class="testo" x="140" y="528" text-anchor="middle">profili_voci.json</text>
    <text class="testo" x="140" y="544" text-anchor="middle">running average of embeddings</text>

    <rect class="voci" x="300" y="480" width="200" height="90" rx="6"/>
    <text class="titolo" x="400" y="508" text-anchor="middle">"Who is who?"</text>
    <text class="testo" x="400" y="528" text-anchor="middle">automatic matching</text>
    <text class="testo" x="400" y="544" text-anchor="middle">listen and confirm names</text>

    <rect class="llm" x="560" y="480" width="180" height="90" rx="6"/>
    <text class="titolo" x="650" y="508" text-anchor="middle">Summary</text>
    <text class="testo" x="650" y="528" text-anchor="middle">Ollama, qwen3.5:9b</text>
    <text class="testo" x="650" y="544" text-anchor="middle">chunked map-reduce</text>

    <rect class="out" x="800" y="480" width="170" height="90" rx="6"/>
    <text class="titolo" x="885" y="508" text-anchor="middle">Outputs</text>
    <text class="testo" x="885" y="528" text-anchor="middle">trascrizione.txt / .json</text>
    <text class="testo" x="885" y="544" text-anchor="middle">riassunto.md</text>

    <path class="linea" d="M240,508 H296"/>
    <text class="nota" x="268" y="500" text-anchor="middle">read</text>
    <path class="linea" d="M300,546 H244"/>
    <text class="nota" x="272" y="562" text-anchor="middle">update</text>
    <path class="linea" d="M500,525 H556"/>
    <path class="linea" d="M740,525 H796"/>
    <path class="linea" d="M400,570 V605 H885 V574"/>
    <text class="nota" x="642" y="599" text-anchor="middle">named transcript</text>
  </g>
</svg>
